server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip was off entirely - every asset (213KB Chart.js bundle included)
    # was served uncompressed. ~65% smaller for JS/CSS/HTML.
    # gzip_static serves the pre-compressed .gz built alongside each file
    # (see Dockerfile) at zero per-request CPU cost - this box only has 1
    # vCPU to spare, and these assets are immutable/content-hashed, so
    # compressing them once at build time beats re-gzipping on every hit.
    # `gzip on` stays as a fallback for anything without a .gz sibling.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # Service worker must never be long-term cached, or offline updates get stuck.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
