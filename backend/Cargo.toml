[package]
name = "elevia-api"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# Web framework
actix-web = "4.11"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
rust_decimal = { version = "1.42", features = ["serde-with-str"] }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Auth
jsonwebtoken = "10.4"
bcrypt = "0.19"

# Utilities
uuid = { version = "1.23", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2.0"

[dev-dependencies]
rust_decimal_macros = "1.40"
cucumber = "0.21"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[test]]
name = "bdd"
harness = false
