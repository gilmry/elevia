# Elevia - orchestration
#
# `dev` and `prod` are separate, mutually exclusive profiles - postgres is the
# only service with no profile (shared by both). Compose starts every
# non-profiled service unconditionally regardless of --profile, so prod
# services are explicitly profiled too; otherwise `--profile dev` would start
# them *alongside* backend-dev/frontend-dev, not instead of them.
#
# Usage:
#   cp .env.example .env               # then adjust secrets/domain
#   docker compose --profile prod up -d --build   # production: Traefik + TLS, served on DOMAIN/API_DOMAIN
#   docker compose --profile dev up --build       # local hot-reload dev mode (no Traefik, direct ports)
#
# Services:
#   - traefik   : reverse proxy, terminates TLS via Let's Encrypt for DOMAIN/API_DOMAIN (prod only)
#   - postgres  : PostgreSQL 16, data persisted in a named volume
#   - backend   : Rust/Actix-web API, waits for postgres healthcheck, runs SQLx migrations on boot
#   - frontend  : Svelte + Astro PWA, served via nginx (prod) or Astro dev server (dev)
#
# Production DNS: point both DOMAIN and API_DOMAIN (A records) at this host before
# starting - Traefik requests Let's Encrypt certificates for them on first boot.

services:
  traefik:
    image: traefik:v3.7
    container_name: elevia-traefik
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      # Traefik's Docker client falls back to a very old default API version
      # (1.24) when it can't auto-negotiate against the daemon, which some
      # Docker Engine versions reject outright ("client version 1.24 is too
      # old"). Pin it explicitly instead of relying on negotiation.
      DOCKER_API_VERSION: "1.41"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all plain HTTP traffic to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@ecosolva.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - elevia-network

  postgres:
    image: postgres:16-alpine
    container_name: elevia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elevia}
      POSTGRES_USER: ${POSTGRES_USER:-elevia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Bind to localhost only - not exposed beyond the host
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elevia} -d ${POSTGRES_DB:-elevia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - elevia-network

  # --- Backend: production-like build (prod profile only), fronted by Traefik ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elevia-backend
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-elevia}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-elevia}
      JWT_SECRET: ${JWT_SECRET:-change-me-too-please-use-a-long-random-string}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      # Bootstraps the first admin account on startup if none exists yet - there is
      # no public endpoint to create one otherwise.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@elevia.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-immediately}
      # Used as the OAuth issuer/endpoint URLs in /.well-known/oauth-authorization-server -
      # without it the backend falls back to deriving its own public URL from
      # X-Forwarded-* request headers, which Traefik doesn't fully set.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.elevia.ecosolva.org}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elevia-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elevia-backend.rule=Host(`${API_DOMAIN:-api.elevia.ecosolva.org}`)"
      - "traefik.http.routers.elevia-backend.entrypoints=websecure"
      - "traefik.http.routers.elevia-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.elevia-backend.loadbalancer.server.port=8080"
      # /auth/login runs bcrypt (deliberately slow) on a 1-vCPU box: a load
      # test found ~20 concurrent requests enough to push p95 latency past
      # 5s for the whole service, not just this route. Rate-limited per
      # source IP so a burst (attack or accidental) can't starve the single
      # CPU core everything else shares.
      - "traefik.http.routers.elevia-backend-login.rule=Host(`${API_DOMAIN:-api.elevia.ecosolva.org}`) && Path(`/auth/login`)"
      - "traefik.http.routers.elevia-backend-login.entrypoints=websecure"
      - "traefik.http.routers.elevia-backend-login.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elevia-backend-login.service=elevia-backend"
      # No explicit priority: Traefik ranks routers by matcher length when
      # priority isn't set, and this rule is already longer/more specific
      # than the catch-all elevia-backend router, so it wins on its own.
      # An earlier explicit "priority=10" here was *lower* than the
      # catch-all's auto-computed priority, so the catch-all matched first
      # and silently bypassed the rate limit for every request - verified
      # live in prod (15 rapid /auth/login calls, zero 429s).
      - "traefik.http.routers.elevia-backend-login.middlewares=elevia-login-ratelimit"
      - "traefik.http.middlewares.elevia-login-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.elevia-login-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.elevia-login-ratelimit.ratelimit.burst=10"

  # --- Backend: dev mode with hot reload (cargo-watch), direct port, no Traefik ---
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: elevia-backend-dev
    profiles: ["dev"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-elevia}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-elevia}
      JWT_SECRET: ${JWT_SECRET:-change-me-too-please-use-a-long-random-string}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: debug
      RUST_BACKTRACE: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@elevia.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-immediately}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elevia-network

  # --- Frontend: production build, served as static PWA via nginx (prod profile only), fronted by Traefik ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.elevia.ecosolva.org}
        PUBLIC_CURRENCY_SYMBOL: ${PUBLIC_CURRENCY_SYMBOL:-FCFA}
    container_name: elevia-frontend
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - backend
    networks:
      - elevia-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elevia-frontend.rule=Host(`${DOMAIN:-elevia.ecosolva.org}`)"
      - "traefik.http.routers.elevia-frontend.entrypoints=websecure"
      - "traefik.http.routers.elevia-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.elevia-frontend.loadbalancer.server.port=80"

  # --- Frontend: dev mode with hot reload (Astro dev server), direct port, no Traefik ---
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: elevia-frontend-dev
    profiles: ["dev"]
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      PUBLIC_CURRENCY_SYMBOL: ${PUBLIC_CURRENCY_SYMBOL:-FCFA}
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    networks:
      - elevia-network

networks:
  elevia-network:
    driver: bridge

volumes:
  postgres_data:
  traefik_certs:
  cargo_cache:
  target_cache:
